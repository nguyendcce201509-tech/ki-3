    <div class="lich">
      <div class="box">
        <h2>📚 Quản lý lịch học tập</h2>

        <!-- Chọn môn -->
        <label>Chọn môn học:</label>

        <select id="subject">
          <option value="LAB211">Môn lab LAB211</option>

          <option value="JPD113">Môn tiếng Nhật JPD113</option>

          <option value="MAS291">Môn Xác suất thống kê MAS291</option>

          <option value="DBI202">Môn cơ sở dữ liệu DBI202</option>
        </select>

        <!-- Chọn loại -->
        <label>Loại sự kiện:</label>

        <select id="type">
          <option value="Thuyết trình">Thuyết trình</option>

          <option value="Bài lab">Bài lab</option>

          <option value="Bài test">Bài test</option>

          <option value="Kiểm tra">Kiểm tra</option>
        </select>

        <!-- Chọn ngày -->
        <label>Ngày:</label>

        <input type="date" id="date" />

        <button onclick="addSchedule()">Thêm lịch</button>

        <div id="result"></div>
      </div>

      <script>
        function addSchedule() {
          // Lấy dữ liệu
          const subject = document.getElementById("subject").value;

          const type = document.getElementById("type").value;

          const date = document.getElementById("date").value;

          if (date == "") {
            alert("Vui lòng chọn ngày");

            return;
          }

          // Chuyển ngày
          const eventDate = new Date(date);

          const today = new Date();

          today.setHours(0, 0, 0, 0);
          eventDate.setHours(0, 0, 0, 0);

          // Tính ngày còn lại
          const diffTime = eventDate - today;

          const diffDays = diffTime / (1000 * 60 * 60 * 24);

          let message = "";

          // Kiểm tra thông báo
          if (diffDays == 1) {
            message = "⚠️ Mai có " + type + " môn " + subject;

            alert(message);
          } else if (diffDays == 0) {
            message = "📢 Hôm nay có " + type + " môn " + subject;
          } else if (diffDays > 1) {
            message =
              "⏳ " +
              type +
              " môn " +
              subject +
              " còn " +
              diffDays +
              " ngày nữa.";
          } else {
            message = "⛔ Sự kiện đã qua.";
          }

          // Hiển thị ra web
          document.getElementById("result").innerHTML += `<div class="item">

           <strong>Môn:</strong>
    ${subject}<br><br>

    <strong>Sự kiện:</strong>
    ${type}<br><br>

    <strong>Ngày:</strong>
    ${date}<br><br>

    ${message}<br><br>
         

   

            </div>`;
          // Lấy dữ liệu cũ
          let schedules = JSON.parse(localStorage.getItem("schedules")) || [];

          // Thêm lịch mới
          schedules.push({
            subject: subject,
            type: type,
            date: date,
          });

          // Lưu lại
          addDoc("schedules", JSON.stringify(schedules));
        }

        // Xin quyền thông báo
        Notification.requestPermission();

        // Kiểm tra thông báo mỗi ngày
        function checkNotifications() {
          // Lấy dữ liệu đã lưu
          const schedules = JSON.parse(localStorage.getItem("schedules")) || [];

          const today = new Date();

          today.setHours(0, 0, 0, 0);

          schedules.forEach(function (item, index) {
            const eventDate = new Date(item.date);

            eventDate.setHours(0, 0, 0, 0);

            const diffDays = (eventDate - today) / (1000 * 60 * 60 * 24);

            // Trước 1 ngày
            if (diffDays == 1) {
              const message = "⚠️ Mai có " + item.type + " môn " + item.subject;

              // Notification góc màn hình
              if (Notification.permission === "granted") {
                new Notification(message);
              }
            }
          });
        }

        // Chạy khi mở web
        checkNotifications();
        // Hiển thị dữ liệu đã lưu khi reload
        window.onload = function () {
          const schedules = JSON.parse(localStorage.getItem("schedules")) || [];

          // Sắp xếp ngày gần nhất
          schedules.sort(function (a, b) {
            return new Date(a.date) - new Date(b.date);
          });

          const today = new Date();

          today.setHours(0, 0, 0, 0);

          schedules.forEach(function (item, index) {
            const eventDate = new Date(item.date);

            eventDate.setHours(0, 0, 0, 0);

            const diffDays = (eventDate - today) / (1000 * 60 * 60 * 24);

            let message = "";

            if (diffDays == 1) {
              message = "⚠️ Mai có " + item.type + " môn " + item.subject;
            } else if (diffDays == 0) {
              message = "📢 Hôm nay có " + item.type + " môn " + item.subject;
            } else if (diffDays > 1) {
              message =
                "⏳ " +
                item.type +
                " môn " +
                item.subject +
                " còn " +
                diffDays +
                " ngày nữa.";
            } else {
              message = "⛔ Sự kiện đã qua.";
            }

            document.getElementById("result").innerHTML += `<div class="item">

      <strong>Môn:</strong>
      ${item.subject}<br><br>

      <strong>Sự kiện:</strong>
      ${item.type}<br><br>

      <strong>Ngày:</strong>
      ${item.date}<br><br>

      ${message}<br><br>
       <button onclick="editSchedule(${index})">
        ✏️ Sửa
      </button>

      <button onclick="deleteSchedule(${index})">
        ❌ Xóa
      </button>

    </div>`;
          });
        };
        function deleteSchedule(index) {
          let schedules = JSON.parse(localStorage.getItem("schedules")) || [];

          schedules.splice(index, 1);

          localStorage.setItem("schedules", JSON.stringify(schedules));

          location.reload();
        }
        function editSchedule(index) {
          let schedules = JSON.parse(localStorage.getItem("schedules")) || [];

          const item = schedules[index];

          const newSubject = prompt("Sửa môn học:", item.subject);

          const newType = prompt("Sửa sự kiện:", item.type);

          const newDate = prompt("Sửa ngày:", item.date);

          schedules[index] = {
            subject: newSubject,
            type: newType,
            date: newDate,
          };

          localStorage.setItem("schedules", JSON.stringify(schedules));

          location.reload();
        }
      </script>
